name: CI/CD - Python CLI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"   # ajuste para a versão-alvo do projeto

jobs:
  build-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e ".[dev]" || pip install -e . || true; fi
          pip install pytest

      # Lint só roda se houver configuração de ruff/flake8 no projeto, para não forçar
      # uma ferramenta que o projeto não adotou.
      - name: Verificar lint configurado
        id: check_lint
        run: |
          if [ -f .flake8 ] || [ -f ruff.toml ] || [ -f .ruff.toml ] \
             || grep -qs "\[tool.ruff\]" pyproject.toml \
             || grep -qs "\[flake8\]" setup.cfg; then
            echo "has_lint=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_lint=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint (ruff)
        if: steps.check_lint.outputs.has_lint == 'true'
        run: |
          pip install ruff
          ruff check .

      - name: Testes (pytest)
        run: pytest

  release:
    name: Build, Package & Release
    needs: build-test
    if: needs.build-test.result == 'success' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      # Empacota só se o projeto tiver [build-system] configurado em pyproject.toml
      # (ou seja, se ele realmente for distribuído como pacote).
      - name: Verificar empacotamento configurado
        id: check_build
        run: |
          if [ -f pyproject.toml ] && grep -qs "\[build-system\]" pyproject.toml; then
            echo "has_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build do pacote
        if: steps.check_build.outputs.has_build == 'true'
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: false
