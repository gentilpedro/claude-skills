name: CI/CD - .NET API

# Ajuste os gatilhos abaixo caso a branch principal do projeto não seja "main".
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

# Permissão mínima por padrão; o job de release eleva para "write" apenas onde precisa.
permissions:
  contents: read

env:
  DOTNET_VERSION: "8.0.x"    # ajuste para a versão-alvo do projeto
  PROJECT_PATH: "."          # ajuste para o caminho da solução/projeto (.sln ou .csproj)

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "${{ env.PROJECT_PATH }}"

      - name: Build
        run: dotnet build "${{ env.PROJECT_PATH }}" --configuration Release --no-restore

      - name: Test
        run: dotnet test "${{ env.PROJECT_PATH }}" --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Publicar resultados de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/test-results.trx"
          if-no-files-found: ignore

  release:
    name: Publish & Release
    needs: build-test
    # Só roda quando a build/test do job anterior passou E o gatilho foi uma tag vMAJOR.MINOR.PATCH.
    if: needs.build-test.result == 'success' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # elevado só neste job, só para criar a release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish
        run: dotnet publish "${{ env.PROJECT_PATH }}" --configuration Release --output ./publish

      - name: Empacotar artefato
        run: |
          cd publish
          zip -r "../release-${{ github.ref_name }}.zip" .

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-${{ github.ref_name }}.zip
          generate_release_notes: true
