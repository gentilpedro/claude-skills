# __APP__ — lido pelo app-deploy e pelo app-backup na VPS (cópia em /opt/__APP__/deploy.conf).

# Porta em 127.0.0.1 onde o serviço web atende (a mesma do docker-compose.yml e do nginx.conf).
PORT=__PORTA__

# Caminho que responde 2xx com o app pronto. O deploy só vale depois dele; se não responder em
# ~60 s, o app-deploy volta para a versão anterior.
HEALTH_PATH=/health

# Nomes que o deploy pode gravar em secrets.env (separados por espaço). Vazio = sem segredos.
# Têm de bater com o passo "Enviar os segredos" do workflow.
SECRETS=""

# Volumes nomeados (sem o prefixo __APP___) que entram no backup diário, além do banco.
BACKUP_VOLUMES=""
