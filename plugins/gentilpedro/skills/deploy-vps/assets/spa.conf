# Nginx DENTRO do container da SPA (não é o do host). Rotas do React Router caem no index.html.
server {
    listen 8080;
    root /usr/share/nginx/html;

    location = /health { access_log off; return 200 "ok\n"; }

    # Arquivos com hash no nome: cache longo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
